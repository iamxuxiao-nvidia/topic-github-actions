name: GitHub Actions Playground - Hello World Bazel

# 推送到 main、向 main 提交 PR，或在网页上手动触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hello-world-bazel:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 下载仓库代码
        uses: actions/checkout@v6

      - name: 构建预装 Bazel 7 的自定义镜像
        run: docker build --tag bazel-hello-world:local .

      - name: 在自定义镜像中编译、运行并检查输出
        run: |
          output=$(
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --env HOME=/tmp \
              --volume "${GITHUB_WORKSPACE}:/workspace" \
              bazel-hello-world:local \
              bash -euo pipefail -c '
                bazel --version >&2
                bazel build //hello-world:hello-world >&2
                bazel run //hello-world:hello-world
              '
          )
          printf '%s\n' "$output"
          test "$output" = "Hello, world!"
          echo "Bazel 编译成功，程序输出：$output" >> "$GITHUB_STEP_SUMMARY"
