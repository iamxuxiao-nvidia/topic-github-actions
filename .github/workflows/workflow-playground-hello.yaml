name: GitHub Actions Playground - Hello

# 可在 GitHub 网页上手动触发，也可由其他工作流调用
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  hello:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 下载仓库代码
        uses: actions/checkout@v6

      - name: 查看执行环境
        run: |
          echo "Hello GitHub Actions!"
          echo "当前仓库：$GITHUB_REPOSITORY"
          uname -a
          ls -la

      - name: 检查入门文档
        run: |
          test -s README.md
          echo "检查通过：入门文档存在且非空。"
