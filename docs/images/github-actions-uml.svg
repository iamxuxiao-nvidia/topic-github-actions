<svg xmlns="http://www.w3.org/2000/svg" width="900" height="950" viewBox="0 0 900 950" role="img" aria-labelledby="title description">
  <title id="title">GitHub Actions Workflow, Jobs, Job, Steps, and Step diagram</title>
  <desc id="description">Workflow contains a Jobs mapping, which contains one or more Jobs. A normal Job has a Steps list, which contains one or more Steps. A Step can run a command or use an Action. A Job can depend on other Jobs through needs. A Workflow can call another reusable Workflow through one of its Jobs using job-level uses. Jobs and Steps represent YAML collection keywords.</desc>
  <defs>
    <marker id="open-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#495a70" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="900" height="950" fill="#ffffff"/>
  <text x="40" y="42" fill="#172b4d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">GitHub Actions: workflow structure</text>
  <text x="40" y="68" fill="#53657d" font-family="Arial, Helvetica, sans-serif" font-size="14">UML style · Jobs and Steps are YAML collection keywords</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="300" y="100" width="300" height="140" rx="6" fill="#f6f9fc" stroke="#375a7f" stroke-width="2"/>
    <rect x="301" y="101" width="298" height="41" fill="#24496d"/>
    <text x="450" y="129" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Workflow</text>
    <text x="318" y="168" fill="#26384d" font-size="16">+ name: String</text>
    <text x="318" y="194" fill="#26384d" font-size="16">+ <tspan font-weight="700">on</tspan>: Event</text>
    <text x="318" y="220" fill="#26384d" font-size="16">+ <tspan font-weight="700">on</tspan>.workflow_call: Event?</text>

    <rect x="300" y="295" width="300" height="95" rx="6" fill="#f4fbf9" stroke="#0f766e" stroke-width="2"/>
    <rect x="301" y="296" width="298" height="41" fill="#0f766e"/>
    <text x="450" y="324" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Jobs  (jobs:)</text>
    <text x="318" y="367" fill="#26384d" font-size="16">+ entries: Map&lt;JobId, Job&gt;</text>

    <rect x="300" y="445" width="300" height="170" rx="6" fill="#f6f9fc" stroke="#375a7f" stroke-width="2"/>
    <rect x="301" y="446" width="298" height="41" fill="#24496d"/>
    <text x="450" y="474" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Job</text>
    <text x="318" y="513" fill="#26384d" font-size="16">+ id: JobId</text>
    <text x="318" y="539" fill="#26384d" font-size="16">+ runs-on: Runner?</text>
    <text x="318" y="565" fill="#26384d" font-size="16">+ needs: JobId[*]</text>
    <text x="318" y="591" fill="#26384d" font-size="16">+ uses: Workflow?</text>

    <rect x="300" y="670" width="300" height="95" rx="6" fill="#f4fbf9" stroke="#0f766e" stroke-width="2"/>
    <rect x="301" y="671" width="298" height="41" fill="#0f766e"/>
    <text x="450" y="699" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Steps  (steps:)</text>
    <text x="318" y="741" fill="#26384d" font-size="16">+ items: Step[1..*]</text>

    <rect x="300" y="820" width="300" height="105" rx="6" fill="#f6f9fc" stroke="#375a7f" stroke-width="2"/>
    <rect x="301" y="821" width="298" height="41" fill="#24496d"/>
    <text x="450" y="849" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Step</text>
    <text x="318" y="886" fill="#26384d" font-size="16">+ name: String?</text>
    <text x="318" y="912" fill="#26384d" font-size="16">+ <tspan font-weight="700">run</tspan> | uses: <tspan font-weight="700">Action</tspan></text>
  </g>

  <g fill="none" stroke="#375a7f" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 450 240 L 438 254 L 450 268 L 462 254 Z" fill="#375a7f"/>
    <line x1="450" y1="268" x2="450" y2="295"/>
    <path d="M 450 390 L 438 404 L 450 418 L 462 404 Z" fill="#375a7f"/>
    <line x1="450" y1="418" x2="450" y2="445"/>
    <path d="M 450 615 L 438 629 L 450 643 L 462 629 Z" fill="#375a7f"/>
    <line x1="450" y1="643" x2="450" y2="670"/>
    <path d="M 450 765 L 438 779 L 450 793 L 462 779 Z" fill="#375a7f"/>
    <line x1="450" y1="793" x2="450" y2="820"/>
  </g>
  <g fill="#26384d" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">
    <text x="486" y="282">jobs: 1</text>
    <text x="486" y="432">entries: 1..*</text>
    <text x="486" y="657">steps: 0..1</text>
    <text x="486" y="807">items: 1..*</text>
  </g>

  <path d="M 600 515 H 750 V 580 H 600" fill="none" stroke="#495a70" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#open-arrow)"/>
  <text x="765" y="552" fill="#37485e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">needs</text>

  <path d="M 600 160 H 870 V 216 H 600" fill="none" stroke="#13806e" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#open-arrow)"/>
  <text x="625" y="185" fill="#08685a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">uses: Workflow → Workflow</text>
  <text x="625" y="205" fill="#08685a" font-family="Arial, Helvetica, sans-serif" font-size="14">via <tspan font-weight="700">jobs</tspan>.&lt;id&gt;.uses</text>
</svg>
